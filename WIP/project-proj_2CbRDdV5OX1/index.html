<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Randmaa</title>

    
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #111827;
            --secondary: #4b5563;
            --accent: #3b82f6;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
        }
    }

    @layer base {
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=2560&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--primary);
        }
    }

    @layer components {
        .btn {
            @apply inline-flex items-center justify-center px-4 py-2 rounded-md font-medium transition-colors duration-200;
        }
        .btn-primary {
            @apply bg-[var(--primary)] text-white hover:bg-opacity-90;
        }
        .btn-outline {
            @apply border border-[var(--primary)] text-[var(--primary)] hover:bg-gray-100;
        }
        .filter-btn {
            @apply px-4 py-2 rounded-full text-sm font-medium transition-all;
        }
        .filter-btn.active {
            @apply bg-[var(--primary)] text-white;
        }
        .filter-btn.inactive {
            @apply bg-gray-200 text-gray-700 hover:bg-gray-300;
        }
    }
    @layer utilities {
        .animate-fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/Carousel.js"></script>
    <script type="text/babel" src="components/ProjectCard.js"></script>
    <script type="text/babel" src="components/ProjectGallery.js"></script>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/Footer.js"></script>
    <script type="text/babel" src="components/AboutBlurb.js"></script>
    <script type="text/babel" src="components/AnimatedTitle.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
